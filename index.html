<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>7-0 Challenge</title>
<link rel="stylesheet" href="styles.css"></head>
<body>
<div class="wrap">
<h1>7-0 Challenge</h1>
<p>Roll a World Cup team, pick one star, build 11 players, then simulate.</p>

<div class="panel">
<h2 id="step">Roll 1 / 11</h2>
<button id="rollBtn">ROLL NEXT 🎲</button>
<div id="draw"></div>
<div id="choices"></div>
</div>

<div class="panel">
<h2>Your XI</h2>
<ol id="squad"></ol>
</div>

<div class="panel">
<button id="simBtn" disabled>SIMULATE</button>
<div id="result"></div>
</div>

<div class="panel">
<h2>History</h2>
<div id="history"></div>
</div>
</div>
<script src="data.js"></script>
<script src="game.js"></script>
</body></html>
